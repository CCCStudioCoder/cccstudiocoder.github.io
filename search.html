<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search | CCCStudio website</title>
    <link rel="stylesheet" href="general.css">
</head>
<body>
    <img src="favicon.ico" id="logo"/>
    <nav><ol>
        <a href="projects">Projects</a>
        <a href="stats">Statistics</a>
        <a href="about">About</a>
        <a href="sustain">Sustain</a>
    </ol></nav>
    <h1>Search</h1>
    <input type="text" id="search" placeholder="Search..."  autofocus="autofocus">
    <button id="searchButton" onclick="search()">Search</button>
    <script>
        function search() {
            const oldResults = document.getElementById('results');
            if (oldResults) {
            oldResults.remove();
            }
            const query = document.getElementById('search').value.toLowerCase();
            const pages = [
                { title: 'advancements', url: 'ore_pack/advancements' },
                { title: 'bronze', url: 'ore_pack/bronze' },
                { title: 'ore pack', url: 'ore_pack/index' },
                { title: 'manganese', url: 'ore_pack/manganese' },
                { title: 'new tools', url: 'ore_pack/new_tools' },
                { title: 'nickel', url: 'ore_pack/nickel' },
                { title: 'ore pack recipes', url: 'ore_pack/recipes' },
                { title: 'silver clock', url: 'ore_pack/silver_clock' },
                { title: 'silver', url: 'ore_pack/silver' },
                { title: 'titanium', url: 'ore_pack/titanium' },
                { title: 'ore pack trades', url: 'ore_pack/trades' },
            ];
            const results = [];
            if (query) {
                pages.forEach(page => {
                    if (page.title.toLowerCase().includes(query)) {
                        results.push(page);
                    }
                });
                if (results.length > 0) {
                    const resultsContainer = document.createElement('div');
                    resultsContainer.id = 'results';
                    results.forEach(result => {
                        const link = document.createElement('a');
                        link.href = result.url;
                        link.textContent = result.title.toUpperCase();
                        link.style.display = 'block';
                        resultsContainer.appendChild(link);
                    });
                    document.body.appendChild(resultsContainer);
                    alert('Search results found!');
                } else {
                    alert('No results found.');
                }
            } else {
                alert('Please enter a search term.');
            }
        }
    </script>
</body>
